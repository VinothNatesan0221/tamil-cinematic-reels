name: Assemble Final Tamil Reel
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the existing cinematic-reel artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact artifact name"
        required: true
        default: "cinematic-reel"
        type: string
permissions:
  actions: read
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing video
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Edge TTS
        run: pip install edge-tts
      - name: Assemble
        run: |
          cp story.json work/story.json
          cp assemble_final_reel.py work/assemble_final_reel.py
          cd work
          python assemble_final_reel.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-tamil-reel
          path: work/final_reel.mp4
          if-no-files-found: error
          retention-days: 7
