name: Build Instagram Publishing Package
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the existing cinematic-reel artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact source artifact name"
        required: true
        default: "cinematic-reel"
        type: string
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download existing cinematic video
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Edge TTS
        run: pip install edge-tts
      - name: Build final Reel and publishing assets
        run: |
          cp story.json work/story.json
          cp assemble_final_reel.py work/assemble_final_reel.py
          cd work
          python assemble_final_reel.py
      - name: Upload Instagram publishing package
        uses: actions/upload-artifact@v4
        with:
          name: instagram-publishing-package
          path: work/publishing_package/
          if-no-files-found: error
          retention-days: 7
