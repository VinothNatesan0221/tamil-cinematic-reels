name: Build Instagram Publishing Package

on:
  workflow_run:
    workflows: ["Generate cinematic Reel"]
    types: [completed]

  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful source render run ID for a manual package retry"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and validate source render run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID="$EVENT_RUN_ID"
          fi
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid source workflow run ID" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download video, matching story and ambience
        uses: actions/download-artifact@v4
        with:
          name: cinematic-reel
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work

      - name: Verify matching source artifact
        run: |
          test -s work/work/cinematic_reel.mp4
          test -s work/work/ambience.wav
          test -s work/work/sfx.wav
          test -s work/story.json
          mv work/work/cinematic_reel.mp4 work/cinematic_reel.mp4
          mv work/work/ambience.wav work/ambience.wav
          mv work/work/sfx.wav work/sfx.wav
          rmdir work/work
          cp assemble_final_reel.py work/assemble_final_reel.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg, fonts and TTS providers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assemble narration, subtitles and publishing assets
        working-directory: work
        run: python assemble_final_reel.py

      - name: Validate publishing package
        run: |
          test -s work/publishing_package/final_reel.mp4
          test -s work/publishing_package/reel_cover.jpg
          test -s work/publishing_package/instagram_caption.txt
          test -s work/publishing_package/english_subtitles.srt
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 work/publishing_package/final_reel.mp4 | grep -qx aac
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 work/publishing_package/final_reel.mp4 | grep -qx '1080x1920'

      - name: Upload review-only Instagram package
        uses: actions/upload-artifact@v4
        with:
          name: instagram-publishing-package
          path: work/publishing_package/
          if-no-files-found: error
          retention-days: 7
