
name: Generate cinematic Reel

on:
  workflow_dispatch:
    inputs:
      draft_json:
        description: "Raw JSON from the Google Sheet row"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Generate images and render video
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 render_reel.py

      - name: Upload finished Reel
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-reel
          path: cinematic_reel.mp4
          retention-days: 7
