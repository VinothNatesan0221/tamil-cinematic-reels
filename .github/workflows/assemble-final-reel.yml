name: Assemble Final Tamil Reel (manual retry)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful render run ID containing the cinematic-reel artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact source artifact name"
        required: true
        default: "cinematic-reel"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate source run ID
        env:
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must contain digits only" >&2
            exit 1
          fi

      - name: Download matching render artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: work

      - name: Verify artifact and stage assembler
        run: |
          test -s work/work/cinematic_reel.mp4
          test -s work/work/ambience.wav
          test -s work/work/sfx.wav
          test -s work/story.json
          mv work/work/cinematic_reel.mp4 work/cinematic_reel.mp4
          mv work/work/ambience.wav work/ambience.wav
          mv work/work/sfx.wav work/sfx.wav
          rmdir work/work
          cp assemble_final_reel.py work/assemble_final_reel.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg, fonts and TTS providers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assemble publishing package
        working-directory: work
        run: python assemble_final_reel.py

      - name: Upload review-only final package
        uses: actions/upload-artifact@v4
        with:
          name: final-tamil-reel-review-package
          path: work/publishing_package/
          if-no-files-found: error
          retention-days: 7
